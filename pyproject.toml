[project]
name = "django-learn"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Olinto Gomes Junior", email = "contato@guarautodiesel.com.br" }
]
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.1",
]

[project.scripts]
django-learn = "django_learn:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "django-debug-toolbar>=8.0.0",
]
prod = [
    "gunicorn>=26.2.0",
]
